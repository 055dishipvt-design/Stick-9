<script>
const TRASH='<svg class="tr" viewBox="0 0 24 26" aria-hidden="true"><path d="M6 0h12v2H6zM0 5h24v2H0zM3 7h2v17H3zM19 7h2v17h-2zM3 24h18v2H3z"/></svg>';
const K='studytracker.v1',BASE={Easy:10,Moderate:20,'Very Hard':35},BONUS=5;

const hm=m=>{m=Math.round(m);return Math.floor(m/60)+'h '+(m%60)+'m'};
const uid=()=>Math.random().toString(36).slice(2,9);
let S,ui={page:'dash',notes:{},info:{},open:{},rv:false,sc:'D',mg:false},mem=null;
function def(){const mk=n=>({id:uid(),name:n,ch:[]});return{v:1,subj:[mk('Community Medicine'),mk('Pathology'),mk('Microbiology')],q:[],rv:[],ses:[],ctr:{},sel:{},pb:{}}}

const nses=()=>({id:uid(),no:S.ses.filter(s=>s.date===today()).length+1,date:today(),closed:false});

 if(live(c).length){const sn=sObj(S.sel.s),cn=sn&&sn.ch.find(x=>x.id===S.sel.c);c.bonus=bonus(c);c.items=live(c);c.fb={s:S.sel.s,c:S.sel.c,sn:sn?sn.name:'—',cn:cn?cn.name:'—'};c.closed=true}else c.date=today();save()}

function tmToggle(){tmSync();const m=S.tm;if(m.at){m.acc=tmSec();m.at=0;if(G.on&&!G.sum&&!G.locked&&!G.paused){G.pe=gel();G.paused=true;G.bp=true;const z=$('#gpz');if(z)z.textContent='Resume'}}else{m.at=Date.now();if(G.bp){G.bp=false;if(G.on&&G.paused){G.start=Date.now()-G.pe*1000;G.paused=false;const z=$('#gpz');if(z)z.textContent='Pause'}}}save();tmUI();if(G.on)gtick();sfx('pop')}
function tmUI(){if(!S||!S.ses||!S.ses.length)return;tmSync();const m=S.tm,s=tmSec(),rem=1800-s,run=!!m.at,txt=rem>=0?fmt(Math.ceil(rem)):'+'+fmt(Math.ceil(-rem));
 const pb=$('#stmb');if(pb)pb.style.width=Math.min(100,s/18)+'%';const p=$('#stmt');if(p){p.textContent=txt;p.style.color=rem<0?'var(--ye)':''}const ic=$('#stmi');if(ic)ic.textContent=run?'⏱':'⏸';const pl=$('#stm');if(pl)pl.classList.toggle('off',!run);

function renum(){const n={};S.ses.forEach(s=>{n[s.date]=(n[s.date]||0)+1;s.no=n[s.date]})}
function fix(){S.q=S.q||[];S.rv=S.rv||[];S.ses=S.ses||[];S.ctr=S.ctr||{};S.sel=S.sel||{};S.pb=S.pb||{};S.subj.forEach(s=>{s.ch=s.ch||[];s.ch.forEach(c=>c.topics=c.topics||[])});S.q.forEach(q=>{if(q.topic===undefined)q.topic=''});
 rollDay();if(!S.ses.length||cur().closed)S.ses.push(nses());
 const c=cur();if(!live(c).length&&c.date!==today())c.date=today();renum();
 const s=sObj(S.sel.s)||S.subj[0];S.sel.s=s?s.id:'';const h=s&&(s.ch.find(x=>x.id===S.sel.c)||s.ch[0]);S.sel.c=h?h.id:'';const tp=h&&h.topics.find(x=>x.id===S.sel.t);S.sel.t=tp?tp.id:''}
const mast=q=>{const v=q.p.flat();return v.reduce((a,b)=>a+Math.max(0,b-1)/2,0)/v.length};
function it(q,k,xp,m){const s=sObj(q.s),c=s&&s.ch.find(x=>x.id===q.c);const tp=c&&c.topics.find(x=>x.id===q.topic);return{s:q.s,c:q.c,tp:q.topic||'',tn:tp?tp.name:'',sn:s?s.name:'?',cn:c?c.name:'?',k,xp,m,mq:!!q.mc}}
function live(ses){const o=[];S.q.filter(q=>q.done&&q.sid===ses.id).forEach(q=>o.push(it(q,'L',q.xp,mast(q))));
 S.rv.filter(r=>r.done&&r.sid===ses.id).forEach(r=>{const q=Q(r.qid);if(q)o.push(it(q,'R',r.xp,r.st.reduce((a,b)=>a+(b-1)/2,0)/3))});return o}
function bonus(s){const p=S.ses[S.ses.indexOf(s)-1];if(!p)return 0;const n=live(s).length;return n>0&&n>(p.items||[]).length?BONUS:0}
function sst(s){const its=s.closed?s.items:live(s),b=s.closed?s.bonus||0:bonus(s),r={lc:0,lx:0,rc:0,rx:0,mc:0,mx:0,bonus:b};
 its.forEach(i=>{if(i.mq){r.mc++;r.mx+=i.xp}else if(i.k==='L'){r.lc++;r.lx+=i.xp}else{r.rc++;r.rx+=i.xp}});r.total=r.lx+r.rx+r.mx+b;return r}
const totalXP=()=>S.ses.reduce((a,s)=>a+sst(s).total,0);

const TITLES=['Newcomer','Learner','Reader','Scholar','Clinician','Registrar','Consultant','Professor','Legend'];
const lvOf=x=>Math.floor((1+Math.sqrt(1+x/12.5))/2),need=L=>50*L*(L-1),ttl=L=>TITLES[Math.min(L-1,TITLES.length-1)];
function lvInfo(){const x=totalXP(),L=lvOf(x),a=need(L),b=need(L+1);return{x,L,a,b,p:Math.max(0,Math.min(1,(x-a)/(b-a)))}}

function agg(){const A={days:{},sub:{},chp:{},top:{},lm:0,rm:0,lq:0,rq:0,ls:0,rs:0,n:0,xp:0};
 S.ses.filter(s=>s.closed).forEach(s=>{const fb=s.fb||{},its=s.items.length?s.items:[{k:'L',s:fb.s,c:fb.c,sn:fb.sn||'—',cn:fb.cn||'—',xp:0,m:null,e:1}],m=30/its.length;
  const d=A.days[s.date]||(A.days[s.date]={n:0,lm:0,rm:0,lq:0,rq:0,xp:0,t:new Set()});
  d.n++;A.n++;d.xp+=s.bonus||0;A.xp+=s.bonus||0;
  if(its.some(i=>i.k==='L'))A.ls++;if(its.some(i=>i.k==='R'))A.rs++;
  its.forEach(i=>{const L=i.k==='L';d[L?'lm':'rm']+=m;A[L?'lm':'rm']+=m;if(!i.e){d[L?'lq':'rq']++;A[L?'lq':'rq']++}d.xp+=i.xp;A.xp+=i.xp;d.t.add(i.sn+' › '+i.cn);
   const sk=i.s||i.sn,ck=i.c||i.cn,sb=A.sub[sk]||(A.sub[sk]={name:i.sn,min:0,q:0,xp:0}),cp=A.chp[ck]||(A.chp[ck]={min:0,q:0,m:[]});
   sb.min+=m;sb.xp+=i.xp;cp.min+=m;if(!i.e){sb.q++;cp.q++}if(i.m!=null)cp.m.push(i.m);if(i.tp){const top=A.top[i.tp]||(A.top[i.tp]={name:i.tn||'Topic',chapter:i.cn||'—',subject:i.sn||'—',min:0,q:0,xp:0});top.min+=m;top.xp+=i.xp;if(!i.e)top.q++}})});
 return A}
function streaks(days){const ks=Object.keys(days).sort();let best=0,run=0,p=null;ks.forEach(k=>{run=p&&addD(p,1)===k?run+1:1;best=Math.max(best,run);p=k});
 let c=0,x=days[today()]?today():addD(today(),-1);while(days[x]){c++;x=addD(x,-1)}return{cur:c,best}}

function shiftMonth(key,delta){const [y,m]=key.split('-').map(Number),d=new Date(y,m-1+delta,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function renderCalendar(days){
 const key=ui.calMonth||today().slice(0,7);ui.calMonth=key;
 const selected=ui.calDate||today();ui.calDate=selected;
 const [yy,mm]=key.split('-').map(Number),first=new Date(yy,mm-1,1),offset=first.getDay(),count=new Date(yy,mm,0).getDate();
 const cells=[];for(let i=0;i<offset;i++)cells.push('<span></span>');
 for(let n=1;n<=count;n++){
  const date=key+'-'+String(n).padStart(2,'0'),d=days[date],mins=d?d.n*30:0;
  const level=!mins?'':mins<90?'lv1':mins<240?'lv2':'lv3';
  const cls=['cal-day',level,date===today()?'today':'',date===selected?'selected':''].filter(Boolean).join(' ');
  cells.push(`<button class="${cls}" data-a="calday" data-v="${date}" ${date>today()?'disabled':''} title="${date}"><span class="num">${n}</span><i class="cal-dot"></i>${d?`<span class="cal-min">${hm(mins)}</span>`:'<span class="cal-min">·</span>'}</button>`);
 }
 const detail=days[selected],dateLabel=new Date(selected+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 const summary=detail?`<div class="cal-stats"><span>${detail.n} sessions</span><span>·</span><span>${hm(detail.n*30)} recorded</span><span>·</span><span>${detail.xp} XP</span><span>·</span><span>${detail.lq+detail.rq} questions</span></div><ul>${[...detail.t].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div class="cal-stats">No completed study sessions recorded for this date.</div>';

}

function rDash(){const A=agg(),st=streaks(A.days),t=today(),D=A.days,tm=A.lm+A.rm;ui.calMonth=ui.calMonth||t.slice(0,7);ui.calDate=ui.calDate||t;

 tpo:d=>{ui.open[d.k]=!ui.open[d.k];rTopics()},
 ptp:d=>{const a=S.q.filter(q=>!q.done&&q.c===d.c&&(q.topic||'')===(d.t||'')).sort((x,y)=>x.n-y.n);if(!a.length)return toast('Everything here is studied');startRun(learnQueue(a[0].id))},
 opn:d=>{S.sel.s=d.s;S.sel.c=d.c;S.sel.t=d.t||'';fix();save();ui.page='work';show()},
 pr:d=>{const r=R(d.r);if(!r)return;startRun([{t:'R',qid:r.qid,rid:r.id}].concat(reviewQueue(r.qid)))},
 run:()=>startRun(learnQueue(null)),
 rrun:()=>startRun(reviewQueue(null)),
 st:d=>{const q=Q(d.q);if(!q||lockd(q))return;const p=q.p[+d.p],v=+d.v;p[+d.s]=p[+d.s]===v?0:v;chk(q);if(q.done)toast('Learned · +'+q.xp+' XP · moved to Review');sv()},
 rs2:d=>{const r=R(d.q);if(!r)return;const v=+d.v;r.st[+d.s]=r.st[+d.s]===v?0:v;rchk(r);sv()},
 rf:d=>{const r=R(d.r);r.st=[3,3,3];rchk(r);sv()},rd:d=>{S.rv=S.rv.filter(r=>r.id!==d.r);sv()},
 ar:d=>{S.rv.push({id:uid(),qid:d.q,sid:cur().id,st:[0,0,0],done:false,xp:0});ui.rv=true;sv();toast('Review card added')},
 nt:d=>{ui.notes[d.q]=!ui.notes[d.q];rLq()},
 np:d=>{const q=Q(d.q);if(q.p.length<8&&!q.done){q.p.push([0,0,0]);sv()}},
 dq:async d=>{if(await conf('Delete this question?')){S.q=S.q.filter(q=>q.id!==d.q);S.rv=S.rv.filter(r=>r.qid!==d.q);sv()}},
 addq:()=>{const{s,c}=S.sel;if(!s||!c)return toast('Add a chapter first');const typed=parseInt($('#qn').value),n=typed>0?typed:nextNum(c);
  if(typed>0&&S.q.some(q=>q.c===c&&(q.topic||'')===(S.sel.t||'')&&q.n===n))return toast('Original #'+n+' already exists in this topic');S.ctr[c]=Math.max(S.ctr[c]||0,n);
  S.q.push({id:uid(),s,c,topic:S.sel.t||'',n,t:$('#qt').value.trim(),d:$('#qd').value,p:Array.from({length:+$('#qp').value},()=>[0,0,0]),note:'',done:false});save();$('#qt').value='';rAll()},
 close:async()=>{const s=cur(),sn=sObj(S.sel.s),cn=sn&&sn.ch.find(x=>x.id===S.sel.c);
  s.bonus=bonus(s);s.items=live(s);s.fb={s:S.sel.s,c:S.sel.c,sn:sn?sn.name:'—',cn:cn?cn.name:'—'};s.closed=true;s.date=today();S.ses.push(nses());S.tm={acc:0,at:Date.now(),sid:cur().id};save();rAll();if(G.on&&!G.sum)ghead();const hh=hourInfo()[s.id];toast(hh&&hh.lost?'🥀 Lost '+hh.lost+' plant'+(hh.lost>1?'s':'')+' · next block started':hh&&hh.rev?'🌱 Revived '+hh.rev+' plant'+(hh.rev>1?'s':'')+(hh.bonus?' + '+hh.bonus+' bonus':'')+' · next block started':'Session saved · next block started');if(hh&&hh.lost){sfx('miss');vib([60,40,60])}},
 resetday:()=>resetDayDialog(),
 resetsession:async()=>{const s=cur();if(!s)return toast('No current session');const yes=await conf('Reset the current session? Completed learning and review progress from this session will be cleared. Other sessions and your question list will remain.');if(!yes)return;undoSessions([s.id]);toast('Current session reset')},
 resetone:async d=>{const s=S.ses.find(x=>x.id===d.sid);if(!s)return;const yes=await conf(`Reset session S${s.no||'—'} from ${s.date||'unknown date'}? Its completed learning/review progress will be cleared.`);if(!yes)return;undoSessions([s.id]);toast(`Session S${s.no||''} reset`)},
 mg:()=>{ui.mg=!ui.mg;rFrm()},
 theme:()=>{const root=document.documentElement;root.dataset.theme=(root.dataset.theme||'dark')==='dark'?'light':'dark';saveTheme(root.dataset.theme)},
 as:async()=>{const n=await ask('New subject');if(n){const s={id:uid(),name:n,ch:[]};S.subj.push(s);S.sel.s=s.id;fix();save();rAll()}},
 rs:async d=>{const s=sObj(d.s),n=await ask('Rename subject',s.name);if(n){s.name=n;save();rAll()}},
 ds:async d=>{if(await conf('Delete this subject, its chapters and their questions?')){const s=sObj(d.s);s.ch.forEach(c=>delete S.ctr[c.id]);const ids=S.q.filter(q=>q.s===d.s).map(q=>q.id);S.q=S.q.filter(q=>q.s!==d.s);S.rv=S.rv.filter(r=>!ids.includes(r.qid));S.subj=S.subj.filter(x=>x.id!==d.s);fix();save();rAll()}},
 ac:async d=>{const n=await ask('New chapter');if(n){const h={id:uid(),name:n,topics:[]};sObj(d.s).ch.push(h);S.sel.s=d.s;S.sel.c=h.id;S.sel.t='';fix();save();rAll()}},
 at:async d=>{const n=await ask('New topic');if(n){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics||[];const t={id:uid(),name:n};c.topics.push(t);S.sel.s=d.s;S.sel.c=d.c;S.sel.t=t.id;fix();save();rAll()}},
 rt:async d=>{const c=sObj(d.s).ch.find(x=>x.id===d.c),t=c.topics.find(x=>x.id===d.t),n=await ask('Rename topic',t.name);if(n){t.name=n;save();rAll()}},
 dt:async d=>{if(await conf('Delete this topic? Questions assigned to it will become unassigned.')){const c=sObj(d.s).ch.find(x=>x.id===d.c);c.topics=c.topics.filter(x=>x.id!==d.t);S.q.forEach(q=>{if(q.topic===d.t)q.topic=''});if(S.sel.t===d.t)S.sel.t='';save();rAll()}},
 rc:async d=>{const h=sObj(d.s).ch.find(x=>x.id===d.c),n=await ask('Rename chapter',h.name);if(n){h.name=n;save();rAll()}},
 dc:async d=>{if(await conf('Delete this chapter and its questions?')){const s=sObj(d.s);s.ch=s.ch.filter(x=>x.id!==d.c);const ids=S.q.filter(q=>q.c===d.c).map(q=>q.id);S.q=S.q.filter(q=>q.c!==d.c);S.rv=S.rv.filter(r=>!ids.includes(r.qid));delete S.ctr[d.c];fix();save();rAll()}},
 iq:()=>{modal(`<b>Import questions (CSV)</b><small>Columns: subject, chapter, topic, number, title, difficulty, parts. For MCQ/SBA also add: type (mcq or sba; blank = written), options (A|B|C|D|E separated by |), answer (a letter for single-answer questions, or T/F letters like TFTTF for true/false statements). "question" also works as the title column and "priority" as difficulty. Missing subjects, chapters and topics are created. Existing question numbers and identical titles are skipped, and your progress is untouched.</small><button class="btn sg" id="cpp">Copy AI prompt (paste it with your JSON into any chat AI)</button><input id="jf" type="file" accept=".csv,.txt,text/csv"><textarea id="jt" rows="6" placeholder="…or paste CSV here"></textarea><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#cpp').onclick=async()=>{try{await navigator.clipboard.writeText(AIP)}catch(e){$('#jt').value=AIP;$('#jt').select();document.execCommand('copy')}toast('Prompt copied')};
  $('#go').onclick=()=>{try{const r=importCSV($('#jt').value);closeM();show();toast(r.add+' added'+(r.skip?', '+r.skip+' skipped':''))}catch(e){toast('Check the CSV header row')}}},
 ex:()=>{const j=JSON.stringify(S,null,1);modal(`<b>Backup (JSON)</b><textarea id="jt" readonly rows="8">${esc(j)}</textarea><div class="row"><button class="btn pk" id="cp">Copy</button><a class="btn" id="dl" download="study-tracker-backup.json">Download</a><button class="btn" id="cx">Close</button></div>`);
  $('#dl').href=URL.createObjectURL(new Blob([j],{type:'application/json'}));$('#cx').onclick=closeM;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(j)}catch(e){$('#jt').select();document.execCommand('copy')}toast('Copied')}},
 im:()=>{modal(`<b>Import backup</b><input id="jf" type="file" accept=".json,application/json"><textarea id="jt" rows="6" placeholder="…or paste JSON here"></textarea><small>This replaces all current data.</small><div class="row"><button class="btn" id="cx">Cancel</button><button class="btn pk" id="go">Import</button></div>`);
  $('#cx').onclick=closeM;$('#jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$('#jt').value=t)};
  $('#go').onclick=()=>{try{const o=JSON.parse($('#jt').value);if(!Array.isArray(o.subj)||!Array.isArray(o.ses))throw 0;S=o;fix();save();closeM();show();toast('Imported')}catch(e){toast('Invalid backup file')}}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{const t=e.target,c=t.dataset.c;if(!c)return;
 if(c==='ssel'){S.sel.s=t.value;S.sel.c='';fix();save();rAll()}else if(c==='csel'){S.sel.c=t.value;S.sel.t='';fix();save();rAll()}else if(c==='tsel'){S.sel.t=t.value;save();rAll()}
 else if(c==='diff'){const q=Q(t.dataset.q);if(q&&!q.done){q.d=t.value;sv()}}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.i==='note'){const q=Q(t.dataset.q);if(q){q.note=t.value;save()}}});
document.addEventListener('keydown',e=>{if(e.target.id==='qt'&&e.key==='Enter')act.addq()});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)ui.open[k]=e.target.open},true);
loadTheme();load();save();show();
</script></body></html>
